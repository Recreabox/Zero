services:
  zero:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    environment:
      SERVICE_FQDN_ZERO_3000: mail-zero.recreabox.com
      SERVICE_URL_ZERO_3000: 'https://mail-zero.recreabox.com'
      NEXT_PUBLIC_BACKEND_URL: 'https://api-mail-zero.recreabox.com'
      NEXT_PUBLIC_APP_URL: 'https://mail-zero.recreabox.com'
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-zerodotemail}
      REDIS_URL: 'http://upstash-proxy'
      REDIS_TOKEN: ${REDIS_TOKEN:-upstash-local-token}
      RESEND_API_KEY: ${RESEND_API_KEY}
      AI_SYSTEM_PROMPT: ${AI_SYSTEM_PROMPT}
      GROQ_API_KEY: ${GROQ_API_KEY}
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL}
      OPENAI_MINI_MODEL: ${OPENAI_MINI_MODEL}
      NEXT_PUBLIC_ELEVENLABS_AGENT_ID: ${NEXT_PUBLIC_ELEVENLABS_AGENT_ID}
      NEXT_PUBLIC_IMAGE_PROXY: ${NEXT_PUBLIC_IMAGE_PROXY}
      NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY}
      NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST}
      NEXT_PUBLIC_IMAGE_API_URL: ${NEXT_PUBLIC_IMAGE_API_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: 'https://mail-zero.recreabox.com'
      COOKIE_DOMAIN: mail-zero.recreabox.com
      AUTUMN_SECRET_KEY: ${AUTUMN_SECRET_KEY}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
      upstash-proxy:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--spider', '--quiet', 'http://127.0.0.1:3000']
      interval: 90s
      timeout: 5s
      retries: 3
      start_period: 10s
    expose:
      - '3000'
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.gzip.compress=true
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
      - traefik.http.routers.mail-zero-http.entrypoints=http
      - traefik.http.routers.mail-zero-http.middlewares=redirect-to-https
      - traefik.http.routers.mail-zero-http.rule=Host(`mail-zero.recreabox.com`)
      - traefik.http.routers.mail-zero-http.service=mail-zero
      - traefik.http.routers.mail-zero.entrypoints=https
      - traefik.http.routers.mail-zero.middlewares=gzip
      - traefik.http.routers.mail-zero.rule=Host(`mail-zero.recreabox.com`)
      - traefik.http.routers.mail-zero.tls=true
      - traefik.http.routers.mail-zero.tls.certresolver=letsencrypt
      - traefik.http.routers.mail-zero.service=mail-zero
      - traefik.http.services.mail-zero.loadbalancer.server.port=3000
      - traefik.http.routers.mail-zero.priority=100
      - traefik.http.routers.https-0-f08skcc0cwgc0s00kccoo0ow-zero.service=mail-zero
      - traefik.http.routers.http-0-f08skcc0cwgc0s00kccoo0ow-zero.service=mail-zero
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  zero-server:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    user: '0:0'
    environment:
      SERVICE_FQDN_ZERO_SERVER_8787: api-mail-zero.recreabox.com
      SERVICE_URL_ZERO_SERVER_8787: 'https://api-mail-zero.recreabox.com'
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-zerodotemail}
      REDIS_URL: 'http://upstash-proxy'
      REDIS_TOKEN: ${REDIS_TOKEN:-upstash-local-token}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: 'https://mail-zero.recreabox.com'
      COOKIE_DOMAIN: mail-zero.recreabox.com
      NEXT_PUBLIC_APP_URL: 'https://mail-zero.recreabox.com'
      NEXT_PUBLIC_BACKEND_URL: 'https://api-mail-zero.recreabox.com'
      AUTUMN_SECRET_KEY: ${AUTUMN_SECRET_KEY}
      DISABLE_CALLS: 'true'
      NODE_ENV: production
      WRANGLER_SEND_METRICS: 'false'
    command: ['/app/scripts/docker/server-entrypoint.sh']
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
      upstash-proxy:
        condition: service_healthy
    expose:
      - '8787'
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.gzip.compress=true
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
      - traefik.http.routers.api-mail-zero-http.entrypoints=http
      - traefik.http.routers.api-mail-zero-http.middlewares=redirect-to-https
      - traefik.http.routers.api-mail-zero-http.rule=Host(`api-mail-zero.recreabox.com`)
      - traefik.http.routers.api-mail-zero-http.service=api-mail-zero
      - traefik.http.routers.api-mail-zero.entrypoints=https
      - traefik.http.routers.api-mail-zero.middlewares=gzip
      - traefik.http.routers.api-mail-zero.rule=Host(`api-mail-zero.recreabox.com`)
      - traefik.http.routers.api-mail-zero.tls=true
      - traefik.http.routers.api-mail-zero.tls.certresolver=letsencrypt
      - traefik.http.routers.api-mail-zero.service=api-mail-zero
      - traefik.http.services.api-mail-zero.loadbalancer.server.port=8787
    healthcheck:
      test: ['CMD', 'wget', '--spider', '--quiet', 'http://127.0.0.1:8787']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  migrations:
    build:
      context: .
      dockerfile: docker/db/Dockerfile
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-zerodotemail}
    depends_on:
      db:
        condition: service_healthy
    command: ['pnpm', 'run', 'db:migrate']
    restart: 'no'

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-zerodotemail}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres', '-d', 'zerodotemail']
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: valkey-server --save 60 1 --loglevel warning
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  upstash-proxy:
    image: hiett/serverless-redis-http:latest
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${REDIS_TOKEN:-upstash-local-token}
      SRH_CONNECTION_STRING: 'redis://valkey:6379'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '--quiet', 'http://127.0.0.1:80']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  valkey-data:
  postgres-data:
